name: Android CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      run_instrumentation_tests:
        description: "Uruchom testy instrumentacyjne (wymaga emulatora)."
        type: boolean
        default: false
      publish_prerelease:
        description: "Opublikuj zweryfikowany debug APK jako trwały techniczny prerelease"
        type: boolean
        default: false
      release_tag:
        description: "Tag wydania, np. mobilecv-vX.Y.Z-rc1; wymagany przy publikacji"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-and-lint:
    name: Build debug + lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./android

      - name: Android lint
        run: ./gradlew lintDebug --stacktrace
        working-directory: ./android

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: ./android

      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: android-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  instrumentation-tests:
    name: Optional instrumentation tests
    runs-on: ubuntu-latest
    needs: build-and-lint
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_instrumentation_tests }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./android

      - name: Run instrumented tests (no emulator provisioning)
        run: ./gradlew connectedDebugAndroidTest --stacktrace
        working-directory: ./android


  publish-prerelease:
    name: Publish technical prerelease
    needs: build-and-lint
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Read Android version
        id: version
        shell: bash
        run: |
          version_name="$(sed -n 's/.*app_version_name by extra("\([^"]*\)").*/\1/p' android/build.gradle.kts)"
          version_code="$(sed -n 's/.*app_version_code by extra(\([0-9][0-9]*\)).*/\1/p' android/build.gradle.kts)"
          test -n "$version_name" && test -n "$version_code"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        shell: bash
        run: |
          test -n "${{ inputs.release_tag }}" || {
            echo "::error::release_tag is required when publish_prerelease=true"
            exit 2
          }

      - name: Download APK from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: android-app-debug
          path: release

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          cd release
          sha256sum app-debug.apk > SHA256SUMS.txt

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: "MobileCV ${{ steps.version.outputs.name }} technical prerelease"
          prerelease: true
          body: |
            Technical debug snapshot of MobileCV ${{ steps.version.outputs.name }} (Android versionCode ${{ steps.version.outputs.code }}).
            This release is a durable state marker, not a production-signed Android distribution.
          files: |
            release/app-debug.apk
            release/SHA256SUMS.txt

      - name: Delete transient APK artifact after prerelease
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.workflow_run.id == ${{ github.run_id }}) | select(.name == "android-app-debug") | .id' | head -n1)"
          if [ -n "$artifact_id" ]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$artifact_id"
          fi
