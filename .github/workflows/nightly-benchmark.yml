name: VO/Planes Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vo-planes-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    name: Run benchmark and compare with baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run benchmark
        run: python scripts/benchmark_vo_planes.py --strict | tee benchmark_metrics.txt
      - name: Add summary
        if: always()
        run: |
          {
            echo "## VO/planes benchmark"
            grep -E "^(VO_|PLANE_|REGRESSION_)" benchmark_metrics.txt | sed 's/^/- `/' | sed 's/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
