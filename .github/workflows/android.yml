name: Android CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      run_instrumentation_tests:
        description: "Uruchom testy instrumentacyjne (wymaga emulatora)."
        type: boolean
        default: false
      publish_prerelease:
        description: "Opublikuj zweryfikowany debug APK jako trwały techniczny prerelease"
        type: boolean
        default: false
      release_tag:
        description: "Tag wydania, np. mobilecv-v1.27.36-rc1; wymagany przy publikacji"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-and-lint:
    name: Build debug + lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./android

      - name: Android lint
        run: ./gradlew lintDebug --stacktrace
        working-directory: ./android

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: ./android

      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: android-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  instrumentation-tests:
    name: Optional instrumentation tests
    runs-on: ubuntu-latest
    needs: build-and-lint
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_instrumentation_tests }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./android

      - name: Run instrumented tests (no emulator provisioning)
        run: ./gradlew connectedDebugAndroidTest --stacktrace
        working-directory: ./android


  publish-prerelease:
    name: Publish technical prerelease
    needs: build-and-lint
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          test -n "${{ inputs.release_tag }}" || {
            echo "::error::release_tag is required when publish_prerelease=true"
            exit 2
          }

      - name: Download APK from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: android-app-debug
          path: release

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          cd release
          sha256sum app-debug.apk > SHA256SUMS.txt

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: "MobileCV 1.27.36 technical prerelease"
          prerelease: true
          body: |
            Technical debug snapshot of MobileCV 1.27.36 (Android versionCode 63).
            This release is a durable state marker, not a production-signed Android distribution.
          files: |
            release/app-debug.apk
            release/SHA256SUMS.txt
